name: CD - Build Standalone Windows Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.1 - required if not triggered by tag push)"
        required: false
        default: ""
        type: string
      draft:
        description: "Publish as GitHub Release draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Release Tag
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]') {
              $tag = "${{ inputs.tag_name }}"
          }
          if (-not $tag) {
              $tag = "v1.0.0"
          }
          Write-Host "Target Release Tag: $tag"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (Pre-release Verification)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_tests.py

      - name: Compile and Package Standalone Release (PyInstaller)
        run: |
          python build_release.py --skip-tests

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $zip = "dist/AutoStockStudio-windows-x64.zip"
          if (Test-Path $zip) {
              $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
              Set-Content -Path "dist/AutoStockStudio-windows-x64.zip.sha256" -Value "$hash  AutoStockStudio-windows-x64.zip"
              Write-Host "SHA256 Checksum: $hash"
          } else {
              throw "Release ZIP not found at $zip"
          }

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoStockStudio-windows-x64
          path: |
            dist/AutoStockStudio-windows-x64.zip
            dist/AutoStockStudio-windows-x64.zip.sha256
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AutoStock Studio ${{ env.RELEASE_TAG }}
          files: |
            dist/AutoStockStudio-windows-x64.zip
            dist/AutoStockStudio-windows-x64.zip.sha256
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
