name: CD - Build Standalone Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish as GitHub Release draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build & Package Windows x64 Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (Pre-release Verification)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_tests.py

      - name: Compile and Package Standalone Release
        run: |
          python build_release.py

      - name: Upload Release Archive as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoStockStudio-windows-x64
          path: dist/AutoStockStudio-windows-x64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoStockStudio-windows-x64.zip
          name: AutoStock Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
