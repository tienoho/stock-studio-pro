name: CD - Build Standalone Windows Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.1 - required if not triggered by tag push)"
        required: false
        default: ""
        type: string
      draft:
        description: "Publish as GitHub Release draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Release Tag
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]') {
              $tag = "${{ inputs.tag_name }}"
          }
          if (-not $tag) {
              $tag = "v1.0.0"
          }
          Write-Host "Target Release Tag: $tag"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (Pre-release Verification)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_tests.py

      - name: Compile and Package Standalone Release (PyInstaller)
        run: |
          python build_release.py --skip-tests

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Windows Installer (.exe) with Inno Setup
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $cleanVer = $tag.TrimStart("v")
          if (-not $cleanVer) { $cleanVer = "1.1.0" }
          Write-Host "Compiling Inno Setup installer for version $cleanVer..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$cleanVer installer.iss

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist" -Include "*.zip", "*.exe" -File
          foreach ($file in $files) {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
              Set-Content -Path "$($file.FullName).sha256" -Value "$hash  $($file.Name)"
              Write-Host "SHA256 Checksum for $($file.Name): $hash"
          }

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoStockStudio-Release-Files
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AutoStock Studio ${{ env.RELEASE_TAG }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
